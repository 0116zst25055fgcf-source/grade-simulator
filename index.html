<!DOCTYPE html>
<html lang = "ja">
    <head>
         <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="robots" content="noindex,follow">
   
         <link rel="stylesheet" href="教科選択.css" />
         <script src="教科選択.js" defer></script>
         <script src="仮システム.js" defer></script>
        <title>教科選択</title>
    </head>
    <body>
        <header class="header">教科選択</header>
    <search>
        <input type="text" id="search" placeholder="キーワードで検索...">


                <!-- 分野の絞り込み -->
        <select id="category-filter">
            <option value="">すべての分野</option>
            <option value="文系">文系</option>
            <option value="社会系">社会系</option>
            <option value="数学系">数学系</option>
            <option value="理系">理系</option>
            <option value="保体系">保体系</option>
            <option value="芸術系">芸術系</option>
            <option value="英系">英系</option>
            <option value="家庭系">家庭系</option>
            <option value="情報系">情報系</option>
            <option value="工学系">工学系</option>
            <option value="環境バイオ系">環境バイオ系</option>
            <option value="その他">その他</option>
        </select>


        <!-- 単位数の絞り込み -->
        <select id="credit-filter">
            <option value="">すべての単位数</option>
            <option value="1">1単位</option>
            <option value="2">2単位</option>
            <option value="4">4単位</option>
        </select>

        <select id="check-filter">
            <option value="">選択しない</option>
            <option value="1">チェック済み</option>
            <option value="0">チェックなし</option>
        </select>
    </search>
       <table id="subject">
        <thead>
            <tr>
                <th>選択</th>
                <th>授業コード</th>
                <th>授業名</th>
                <th>単位数</th>
                <th>分野</th>
                <th>一年前期</th>
                <th>一年後期</th>
                <th>二年前期</th>
                <th>二年後期</th>
                <th>三年前期</th>
                <th>三年後期</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
        </table>
        <button id="run-button">判定</button>
    </body>
</html>
